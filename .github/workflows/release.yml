name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: dev # We checkout dev so that we can update and commit the formula there

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Package Distributions
        run: |
          python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update and Commit Homebrew Formula
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Run python update script to bump formula version and sha256
          python -c '
          import re, urllib.request, hashlib, os
          ref = os.environ.get("GITHUB_REF", "")
          version = ref.split("/")[-1].replace("v", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "Data-Wise/agy-cli")
          tarball_url = f"https://github.com/{repo}/archive/refs/tags/v{version}.tar.gz"
          
          print(f"Downloading tarball from: {tarball_url}")
          req = urllib.request.Request(
              tarball_url, 
              headers={"User-Agent": "Mozilla/5.0"}
          )
          with urllib.request.urlopen(req) as response:
              data = response.read()
          sha256_val = hashlib.sha256(data).hexdigest()
          print(f"Calculated SHA256: {sha256_val}")
          
          path = "Formula/agy.rb"
          with open(path, "r") as f:
              content = f.read()
          content = re.sub(r"url\s+\"[^\"]+\"", f"url \"{tarball_url}\"", content)
          content = re.sub(r"sha256\s+\"[0-9a-fA-F]{64}\"", f"sha256 \"{sha256_val}\"", content)
          with open(path, "w") as f:
              f.write(content)
          '
          
          git add Formula/agy.rb
          git commit -m "chore: bump Homebrew formula to ${GITHUB_REF#refs/tags/}"
          git push origin dev

