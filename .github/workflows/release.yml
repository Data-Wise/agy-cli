name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Package Distributions
        run: |
          python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate Release Tarball Hash
        run: |
          echo "============================================================"
          echo "HOMEBREW FORMULA HELPER"
          echo "============================================================"
          VERSION=${GITHUB_REF#refs/tags/v}
          TARBALL_URL="https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.tar.gz"
          echo "URL: ${TARBALL_URL}"
          
          # Download source code archive to calculate sha256
          curl -sL -o archive.tar.gz "${TARBALL_URL}"
          SHA_VAL=$(sha256sum archive.tar.gz | awk '{print $1}')
          echo "SHA256: ${SHA_VAL}"
          echo "============================================================"
